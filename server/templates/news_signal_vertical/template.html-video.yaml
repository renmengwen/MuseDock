id: news_signal_vertical
name: 竖屏财经信号
description: 9:16 竖屏科技财经新闻模板，适合数字冲击、时间线、估值、风险条款和战略解释。
category: news
tags:
  - 竖屏
  - 财经
  - 科技
  - 数据
  - 新闻
engine: hyperframes
engine_version: "1.0.0"
source_entry: source/index.html
output:
  resolution:
    width: 1080
    height: 1920
  fps: 30
  duration: 6
inputs:
  schema:
    headline:
      type: string
      required: true
      max_length: 32
      description: 当前场景主标题。
    eyebrow:
      type: string
      required: false
      max_length: 28
      description: 顶部分类或关键词。
    metric:
      type: string
      required: false
      max_length: 24
      description: 当前场景最重要的数字或短语。
    bullets:
      type: array
      required: false
      max_items: 4
      description: 场景要点列表。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/08。
    footer_text:
      type: string
      required: false
      max_length: 36
      description: 底部说明。
    duration_sec:
      type: number
      required: false
      description: 当前场景时长，单位秒。
  examples:
    - headline: 600 亿美元全股票收购
      eyebrow: 科技财经 / 并购
      metric: $60B
      bullets:
        - SpaceX 收购 Cursor 母公司
        - 全股票交易
        - Anysphere 估值翻倍
      section_no: 01/08
      footer_text: Anysphere 并购要点速览
      duration_sec: 6
preview:
  title: 竖屏财经信号预览
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution: []
