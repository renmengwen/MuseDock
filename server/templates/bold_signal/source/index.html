<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>信号卡片</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:#1a1a1a;background-image:linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 50%,#1a1a1a 100%);color:#fff;font-family:'Space Grotesk','Noto Sans SC',sans-serif;position:relative}
  .section-no{position:absolute;top:88px;left:96px;font-family:'Archivo Black','Noto Sans SC',sans-serif;font-size:96px;line-height:1;color:#fff;opacity:0;transform:translateY(-30px);animation:rollIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.2s forwards}
  .section-no .dim{opacity:0.3}
  @keyframes rollIn{to{opacity:1;transform:translateY(0)}}
  .nav{position:absolute;top:104px;right:96px;display:flex;gap:28px;font-size:18px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
  .nav span{opacity:0;animation:fade 0.5s ease-out forwards;color:#fff}
  .nav span.active{color:#FF5722;animation:fadeActive 0.5s ease-out forwards}
  @keyframes fade{to{opacity:0.35}}
  @keyframes fadeActive{to{opacity:1}}
  .card{position:absolute;right:0;top:240px;width:1180px;height:600px;background:#FF5722;color:#1a1a1a;border-radius:36px 0 0 36px;padding:96px 110px;display:flex;flex-direction:column;justify-content:flex-end;transform:translateX(110%);animation:cardSlide 0.9s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;box-shadow:-40px 30px 90px rgba(255,87,34,0.18)}
  @keyframes cardSlide{to{transform:translateX(0)}}
  .card-label{font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;opacity:0;animation:fadeUp 0.6s ease-out 1.15s forwards}
  .card-title{font-family:'Archivo Black','Noto Sans SC',sans-serif;font-size:130px;line-height:0.94;letter-spacing:0;margin-top:28px;opacity:0;animation:fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1.3s forwards;white-space:pre-line}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(28px)}100%{opacity:1;transform:translateY(0)}}
  .footer{position:absolute;bottom:80px;left:96px;display:flex;gap:16px;align-items:center;font-size:16px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#fff;opacity:0;animation:fade 0.6s ease-out 1.6s forwards}
  .footer .tick{width:40px;height:3px;background:#FF5722}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.section-no{opacity:1;transform:none}.nav span{opacity:0.35}.nav span.active{opacity:1}.card{transform:translateX(0)}.card-label,.card-title{opacity:1;transform:none}.footer{opacity:1}}
</style>
</head>
<body>
  <div class="section-no" data-hv-element-id="section_no" data-hv-bind="section_no">01<span class="dim">/04</span></div>

  <div class="nav" data-hv-element-id="nav_items" data-hv-bind="nav_items">
    <span class="active" style="animation-delay:.4s">信号</span>
    <span style="animation-delay:.5s">构建</span>
    <span style="animation-delay:.6s">发布</span>
    <span style="animation-delay:.7s">扩展</span>
  </div>

  <div class="card">
    <div class="card-label" data-hv-element-id="card_label" data-hv-bind="card_label">发布 · 2026</div>
    <div class="card-title" data-hv-element-id="card_title" data-hv-bind="card_title">带上你
自己的 Agent。</div>
  </div>

  <div class="footer"><span class="tick"></span><span data-hv-element-id="footer_text" data-hv-bind="footer_text">创意视频 · Bold Signal</span></div>

  <script>
    const vars = window.__HV_VARS__ || {};
    const duration = Number(window.__HV_DURATION__ || vars.duration_sec || 6);
    const defaults = {
      card_title: '带上你\n自己的 Agent。',
      card_label: '发布 · 2026',
      section_no: '01/04',
      nav_items: [
        { text: '信号', is_active: true },
        { text: '构建' },
        { text: '发布' },
        { text: '扩展' }
      ],
      footer_text: '创意视频 · Bold Signal'
    };
    function setText(selector, value) {
      const node = document.querySelector(selector);
      if (node) node.textContent = value;
    }
    function normalizeNavItems(value) {
      const items = Array.isArray(value) && value.length ? value : defaults.nav_items;
      return items.map((item, index) => {
        if (typeof item === 'string') return { text: item, is_active: index === 0 };
        return { text: item && item.text ? String(item.text) : '', is_active: item && item.is_active === true };
      }).filter((item) => item.text);
    }
    function renderNav(items) {
      const nav = document.querySelector('[data-hv-bind="nav_items"]');
      if (!nav) return;
      while (nav.firstChild) nav.removeChild(nav.firstChild);
      items.slice(0, 5).forEach((item, index) => {
        const span = document.createElement('span');
        span.textContent = item.text;
        span.style.animationDelay = `${0.4 + index * 0.1}s`;
        if (item.is_active || (!items.some((entry) => entry.is_active) && index === 0)) {
          span.className = 'active';
        }
        nav.appendChild(span);
      });
    }
    setText('[data-hv-bind="card_title"]', vars.card_title || defaults.card_title);
    setText('[data-hv-bind="card_label"]', vars.card_label || defaults.card_label);
    setText('[data-hv-bind="section_no"]', vars.section_no || defaults.section_no);
    setText('[data-hv-bind="footer_text"]', vars.footer_text || defaults.footer_text);
    renderNav(normalizeNavItems(vars.nav_items));
    window.__timelines = window.__timelines || {};
    window.__timelines.main = { duration };
  </script>
</body>
</html>
