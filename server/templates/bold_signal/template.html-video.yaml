id: bold_signal
name: 信号卡片
description: 深色背景和橙色焦点卡片滑入，包含章节编号、导航和发布标签，适合产品功能发布。
category: heroes
tags:
  - 产品
  - 功能
  - 发布
  - 卡片
  - 橙色
  - signal
  - launch
  - agent
engine: hyperframes
engine_version: "1.0.0"
source_entry: source/index.html
output:
  resolution:
    width: 1920
    height: 1080
  fps: 30
  duration: 5
inputs:
  schema:
    card_title:
      type: string
      required: true
      max_length: 28
      description: 卡片大标题。
    card_label:
      type: string
      required: false
      max_length: 24
      description: 卡片标签。
    section_no:
      type: string
      required: false
      max_length: 8
      description: 章节编号，例如 01/04。
    nav_items:
      type: array
      required: false
      max_items: 5
      description: 导航项数组，支持字符串或 { text, is_active }。
    footer_text:
      type: string
      required: false
      max_length: 36
      description: 底部标注。
    duration_sec:
      type: number
      required: false
      description: 目标时长，单位秒。
  examples:
    - card_title: 带上你自己的 Agent。
      card_label: 发布 · 2026
      section_no: 01/04
      nav_items:
        - text: 信号
          is_active: true
        - text: 构建
        - text: 发布
        - text: 扩展
      footer_text: 创意视频 · Bold Signal
      duration_sec: 5
preview:
  poster: preview.png
  title: 信号卡片预览
license:
  name: Apache-2.0
  commercial_use: true
  attribution_required: false
assets_attribution:
  - title: Archivo Black
    author: Omnibus-Type
    license: OFL-1.1
    url: https://fonts.google.com/specimen/Archivo+Black
  - title: Space Grotesk
    author: Florian Karsten
    license: OFL-1.1
    url: https://fonts.google.com/specimen/Space+Grotesk
  - title: Noto Sans SC
    author: Google
    license: OFL-1.1
    url: https://fonts.google.com/noto/specimen/Noto+Sans+SC
