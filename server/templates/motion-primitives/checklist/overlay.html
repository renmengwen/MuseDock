<div data-mp-overlay="checklist" data-mp-placement="right_panel"
     style="position:absolute;right:48px;top:300px;width:440px;bottom:380px;pointer-events:none">
  <style>
    [data-mp-overlay="checklist"] .mp-cl-item { display:flex; gap:12px; align-items:flex-start; margin-bottom:16px;
      padding:16px 20px; border-radius:12px; background:var(--mp-surface, rgba(18,16,14,.82));
      color:var(--mp-foreground, #F4EFE7); font-size:28px; line-height:1.4; opacity:0;
      animation:mp-cl-in .4s ease-out forwards; }
    [data-mp-overlay="checklist"] .mp-cl-item:nth-child(2) { animation-delay:.4s; }
    [data-mp-overlay="checklist"] .mp-cl-item:nth-child(3) { animation-delay:.8s; }
    [data-mp-overlay="checklist"] .mp-cl-check { color:var(--mp-accent, #FF5A36); font-weight:800; }
    @keyframes mp-cl-in { from { transform:translateX(24px); opacity:0; } to { transform:none; opacity:1; } }
  </style>
  <div class="mp-cl-item"><span class="mp-cl-check">✓</span><span data-mp-slot="item_1">要点一</span></div>
  <div class="mp-cl-item"><span class="mp-cl-check">✓</span><span data-mp-slot="item_2">要点二</span></div>
  <div class="mp-cl-item"><span class="mp-cl-check">✓</span><span data-mp-slot="item_3">要点三</span></div>
</div>
