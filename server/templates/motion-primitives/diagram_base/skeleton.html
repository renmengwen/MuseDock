<div data-mp-diagram-base
     style="position:absolute;left:0;right:0;top:0;bottom:140px;background:var(--mp-background, #12100E);pointer-events:none">
  <style>
    [data-mp-diagram-base] { --mp-pad: 48px; color: var(--mp-foreground, #F4EFE7);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    [data-mp-diagram-base] .mp-dg-kicker { position:absolute; left:var(--mp-pad); top:160px;
      font-size:30px; font-weight:800; color:var(--mp-accent, #FF5A36); letter-spacing:.08em; }
    [data-mp-diagram-base] .mp-dg-title { position:absolute; left:var(--mp-pad); right:var(--mp-pad); top:210px;
      font-size:52px; font-weight:800; line-height:1.25; }
    [data-mp-diagram-base] .mp-dg-stage { position:absolute; left:var(--mp-pad); right:var(--mp-pad);
      top:380px; bottom:80px; border-radius:20px;
      background:var(--mp-surface, rgba(244,239,231,.06)); border:1px solid rgba(244,239,231,.14); }
  </style>
  <div class="mp-dg-kicker" data-mp-slot="kicker">主题</div>
  <div class="mp-dg-title" data-mp-slot="title">结构化标题</div>
  <div class="mp-dg-stage" data-mp-slot="stage"><!-- 结构图/卡片组/因果链在此区域内绘制 --></div>
</div>
