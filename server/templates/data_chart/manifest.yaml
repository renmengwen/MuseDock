id: data_chart
name: NYT数据图表
description: 纽约时报风格数据图表，SVG折线图+编辑体排版+强调色数据点，适合数据故事
category: data
tags: [数据, 图表, 折线图, NYT, 数据可视化, 趋势, chart, data]
best_for:
  - 数据趋势展示
  - 行业报告
  - 增长/变化对比
  - 数据故事
not_for:
  - 纯文字内容
  - 品牌氛围类
  - 步骤教程类
aspect_support: ['16:9']
duration_range: [5, 15]
inputs:
  title:
    type: string
    required: true
    max_length: 60
    description: 图表标题
  kicker:
    type: string
    required: false
    max_length: 40
    description: 顶部标签
  data_points:
    type: array
    required: true
    max_items: 12
    description: 数据点数组 [{label, value}]
  annotation:
    type: string
    required: false
    max_length: 40
    description: 数据注释/转折点说明
license: Apache-2.0
