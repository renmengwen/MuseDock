<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>大字报海报</title>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Libre+Baskerville:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:#F5F2EF;color:#1C1410;font-family:'Space Grotesk','Noto Sans SC',sans-serif;position:relative}
  .sheet{position:absolute;inset:0;background:#F5F2EF;opacity:0;animation:sheetIn 0.5s ease-out forwards}
  @keyframes sheetIn{to{opacity:1}}
  .kicker{position:absolute;top:92px;left:110px;right:110px;display:flex;align-items:center;gap:28px}
  .kicker .label{font-size:22px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:#1C1410;white-space:nowrap;opacity:0;animation:fade 0.5s ease-out 0.35s forwards}
  .kicker .rule{flex:1;height:3px;background:#D8000F;transform-origin:left center;transform:scaleX(0);animation:ruleX 0.8s cubic-bezier(0.16,1,0.3,1) 0.5s forwards}
  .kicker .date{font-size:22px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#1C1410;white-space:nowrap;opacity:0;animation:fade 0.5s ease-out 0.55s forwards}
  @keyframes ruleX{to{transform:scaleX(1)}}
  .figure{position:absolute;top:150px;right:96px;font-family:'Shrikhand',cursive;font-size:320px;line-height:0.8;color:#D8000F;letter-spacing:1px;opacity:0;transform:translateY(-60px) rotate(-14deg);animation:figureIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.7s forwards}
  @keyframes figureIn{to{opacity:1;transform:translateY(0) rotate(-6deg)}}
  .head{position:absolute;left:110px;bottom:300px;font-family:'Shrikhand',cursive;line-height:0.86}
  .head .ln{display:block;font-size:150px;opacity:0;transform:translateY(40px)}
  .head .ln1{color:#1C1410;transform-origin:left bottom;animation:lineUp 0.7s cubic-bezier(0.16,1,0.3,1) 1.15s forwards}
  .head .ln2{color:#D8000F;animation:lineUpTilt 0.7s cubic-bezier(0.16,1,0.3,1) 1.35s forwards}
  .head .ln3{color:#1C1410;animation:lineUpTilt2 0.7s cubic-bezier(0.16,1,0.3,1) 1.55s forwards}
  @keyframes lineUp{to{opacity:1;transform:translateY(0) rotate(-2deg)}}
  @keyframes lineUpTilt{to{opacity:1;transform:translateY(0) rotate(-4deg)}}
  @keyframes lineUpTilt2{to{opacity:1;transform:translateY(0) rotate(2deg)}}
  .standfirst{position:absolute;left:114px;bottom:200px;max-width:980px;font-family:'Libre Baskerville','Noto Sans SC',serif;font-style:italic;font-size:34px;line-height:1.4;color:#1C1410;opacity:0;animation:fadeUp 0.7s ease-out 1.95s forwards}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:translateY(0)}}
  .footer{position:absolute;left:110px;right:110px;bottom:96px}
  .footer .rule{height:2px;background:#1C1410;transform-origin:left center;transform:scaleX(0);animation:ruleX 0.7s cubic-bezier(0.16,1,0.3,1) 2.15s forwards}
  .footer .meta{display:flex;justify-content:space-between;margin-top:18px;font-size:18px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#1C1410;opacity:0;animation:fade 0.6s ease-out 2.4s forwards}
  .footer .meta .red{color:#D8000F}
  @keyframes fade{to{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.sheet{opacity:1}.kicker .label,.kicker .date{opacity:1}.kicker .rule,.footer .rule{transform:scaleX(1)}.figure{opacity:1;transform:rotate(-6deg)}.head .ln1{opacity:1;transform:rotate(-2deg)}.head .ln2{opacity:1;transform:rotate(-4deg)}.head .ln3{opacity:1;transform:rotate(2deg)}.standfirst,.footer .meta{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="sheet"></div>

  <div class="kicker">
    <span class="label">宣言</span>
    <span class="rule"></span>
    <span class="date">Vol. 04 · 2026</span>
  </div>

  <div class="figure">03</div>

  <div class="head">
    <span class="ln ln1">做得</span>
    <span class="ln ln2">响亮。</span>
    <span class="ln ln3">做得持久。</span>
  </div>

  <div class="standfirst">每一页幻灯片都应该像印刷品一样落地——用粗体排版，锁定一个红色强调色，用墨线分割。</div>

  <div class="footer">
    <div class="rule"></div>
    <div class="meta">
      <span>Bold Poster</span>
      <span class="red">创意视频</span>
    </div>
  </div>

  <script src="./gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 5 });
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
