<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>流体光斑英雄</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&family=Source+Serif+Pro:ital,wght@1,400;1,600&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter Tight','Noto Sans SC',system-ui,sans-serif;background:#1e1b4b;width:1920px;height:1080px;overflow:hidden;color:#fafaf8;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen;filter:blur(70px);will-change:transform}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,-60px) scale(1.15)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-100px,40px) scale(0.9)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(0.95)}50%{transform:translate(50px,80px) scale(1.2)}}
  .b1{width:600px;height:600px;background:#a78bfa;top:-100px;left:-100px;animation:float1 12s ease-in-out infinite}
  .b2{width:520px;height:520px;background:#7c5cff;top:30%;right:-100px;animation:float2 10s ease-in-out infinite}
  .b3{width:480px;height:480px;background:#ec4899;bottom:-100px;left:30%;animation:float3 14s ease-in-out infinite}
  .b4{width:380px;height:380px;background:#06b6d4;top:60%;left:10%;animation:float1 16s ease-in-out infinite;opacity:0.6}
  .text-diff{mix-blend-mode:difference;color:#fafaf8}
  .chip{font-family:'Inter Tight',sans-serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase}
  .serif-em{font-family:'Source Serif Pro',serif;font-style:italic;font-weight:600}
  body::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:64px 64px;z-index:1}
  .header-bar{position:absolute;top:48px;left:48px;right:48px;display:flex;align-items:baseline;justify-content:space-between;z-index:10;opacity:0.7}
  .footer-bar{position:absolute;bottom:48px;left:48px;right:48px;display:flex;align-items:baseline;justify-content:space-between;z-index:10;opacity:0.6}
  @media(prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <div class="header-bar chip text-diff">
    <span>创意视频 · FRAME · LIQUID HERO</span>
    <span>AURORA VIOLET</span>
    <span>2026 · 1920 × 1080</span>
  </div>

  <main style="position:relative;z-index:10;text-align:center;max-width:1100px">
    <h1 class="text-diff" style="font-size:128px;font-weight:900;line-height:0.95;letter-spacing:-0.03em">
      最好的内容,<span class="serif-em">是</span><br/>
      让人忘了在看视频。
    </h1>
    <p class="text-diff" style="margin-top:32px;opacity:0.8;font-size:24px;font-weight:500">
      创意视频 · 用设计讲故事
    </p>
    <div class="text-diff" style="margin-top:40px;display:inline-flex;align-items:center;gap:12px;font-size:13px;font-weight:600;padding:8px 20px;border-radius:999px;border:1px solid rgba(255,255,255,0.4)">
      ⌘ 开始创作
    </div>
  </main>

  <div class="footer-bar chip text-diff">
    <span>FRAME-LIQUID-BG-HERO</span>
    <span>PREFERS-REDUCED-MOTION SAFE</span>
    <span>CREATIVE-VIDEO</span>
  </div>

  <script src="./gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 6 });
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
