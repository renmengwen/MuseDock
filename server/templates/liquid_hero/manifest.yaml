id: liquid_hero
name: 流体光斑英雄
description: 极光流体背景+混合模式文字变色，梦幻渐变氛围，适合品牌/产品/态度表达
category: heroes
tags: [品牌, 产品, 极光, 流体, 渐变, 氛围, 梦幻, hero]
best_for:
  - 品牌宣传片
  - 产品发布
  - 态度/观点表达
  - 氛围感视频
not_for:
  - 数据展示
  - 教程/步骤类
  - 快节奏内容
aspect_support: ['16:9']
duration_range: [3, 12]
inputs:
  headline:
    type: string
    required: true
    max_length: 30
    description: 主标题，可含换行
  subline:
    type: string
    required: false
    max_length: 50
    description: 副标题
  tag:
    type: string
    required: false
    max_length: 20
    description: 标签/CTA文字
license: Apache-2.0
