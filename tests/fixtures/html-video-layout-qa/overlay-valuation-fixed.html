<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>估值覆盖布局修复</title>
  <style>
    *{box-sizing:border-box}
    h1,p{margin:0}
    body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4efe7;color:#18212f}
    section{position:relative;width:1920px;height:1080px;padding:120px 130px}
    .card{position:absolute;left:130px;top:120px;width:980px;height:600px}
    .headline{position:absolute;left:0;top:0;width:980px;font-size:92px;line-height:1.06;font-weight:800}
    .body-copy{position:absolute;left:0;top:240px;width:640px;font-size:42px;line-height:1.38;font-weight:500}
    .launch-zone{position:absolute;right:70px;bottom:40px;width:360px;height:150px;border:2px solid #df7d37;background:rgba(255,229,194,.86)}
    .valuation{position:absolute;left:22px;top:20px;font-size:64px;line-height:1;font-weight:900;color:#a94513}
    .label{position:absolute;left:26px;top:96px;font-size:30px;font-weight:700;color:#593018}
  </style>
</head>
<body>
  <section data-role="scene_06">
    <article class="card" data-role="story-card">
      <h1 class="headline" data-text-key="headline">新材料项目进入商业化拐点</h1>
      <p class="body-copy" data-text-key="body">预计三年内核心工艺会带来稳定现金流，市场对估值弹性的关注正在快速升温。</p>
    </article>
    <div class="launch-zone" data-role="decorative-valuation">
      <div class="valuation" data-text-key="valuation">¥8.6B</div>
      <div class="label" data-text-key="valuation-label">目标估值</div>
    </div>
  </section>
</body>
</html>
