<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>data-role 容器溢出</title>
  <style>
    *{box-sizing:border-box}
    h2,p{margin:0}
    body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Arial,"Microsoft YaHei",sans-serif;background:#111923;color:#f6f0e8}
    section{position:relative;width:1920px;height:1080px;padding:100px 128px}
    [data-role="metric-card"]{position:absolute;left:260px;top:160px;width:820px;height:280px;border:4px solid #e9b44c;background:#243447;overflow:hidden}
    .card-title{position:absolute;left:48px;top:245px;width:700px;font-size:58px;line-height:1.1;font-weight:800;color:#fff}
    .caption{position:absolute;left:260px;top:520px;width:860px;font-size:38px;line-height:1.3;color:#d9e3ee}
  </style>
</head>
<body>
  <section data-role="scene_09">
    <div data-role="metric-card">
      <h2 class="card-title" data-text-key="card-title">数据卡片标题溢出</h2>
    </div>
    <p class="caption" data-text-key="caption">真实模板会用 div data-role 作为卡片容器。</p>
  </section>
</body>
</html>
